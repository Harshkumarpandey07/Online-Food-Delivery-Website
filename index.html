<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshBite - Online Food Delivery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>🍽️ FreshBite Food Delivery</header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <h2>Our Popular Dishes</h2>

    <div class="menu" id="menu">
      <div class="item">
        <img src="https://source.unsplash.com/400x300/?pizza" alt="Pizza">
        <h3>Margherita Pizza</h3>
        <p>₹299</p>
        <button onclick="addToCart('Margherita Pizza', 299)">Add to Cart</button>
      </div>

      <div class="item">
        <img src="https://source.unsplash.com/400x300/?burger" alt="Burger">
        <h3>Cheese Burger</h3>
        <p>₹199</p>
        <button onclick="addToCart('Cheese Burger', 199)">Add to Cart</button>
      </div>

      <div class="item">
        <img src="https://source.unsplash.com/400x300/?pasta" alt="Pasta">
        <h3>Italian Pasta</h3>
        <p>₹249</p>
        <button onclick="addToCart('Italian Pasta', 249)">Add to Cart</button>
      </div>

      <div class="item">
        <img src="https://source.unsplash.com/400x300/?biryani" alt="Biryani">
        <h3>Chicken Biryani</h3>
        <p>₹349</p>
        <button onclick="addToCart('Chicken Biryani', 349)">Add to Cart</button>
      </div>
    </div>

    <div class="cart">
      <h2>Your Cart</h2>
      <ul id="cart-list"></ul>
      <div class="checkout">
        <strong>Total: ₹<span id="total">0</span></strong>
        <button onclick="checkout()">Checkout</button>
      </div>
    </div>
  </div>

  <footer>
    © 2025 FreshBite. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
